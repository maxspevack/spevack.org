<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {%- assign page_title = page.title | default: site.title -%}
    {%- assign page_description = page.description | default: site.description -%}
    {%- assign page_image = "/max.jpg" | absolute_url -%}
    {%- assign canonical = page.url | absolute_url -%}

    <title>{{ page_title }}</title>
    <meta name="description" content="{{ page_description }}">
    <meta name="author" content="Max Spevack">
    <link rel="canonical" href="{{ canonical }}">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:title" content="{{ page_title }}">
    <meta property="og:description" content="{{ page_description }}">
    <meta property="og:url" content="{{ canonical }}">
    <meta property="og:image" content="{{ page_image }}">
    <meta property="og:image:width" content="400">
    <meta property="og:image:height" content="400">
    <meta property="og:image:alt" content="Portrait of Max Spevack">
    <meta property="og:locale" content="en_US">

    <!-- Twitter (title/description/image fall back to the og:* tags above) -->
    <meta name="twitter:card" content="summary">

    <!-- Theme color (mobile browser chrome) -->
    <meta name="theme-color" content="#fdfbf7">

    <!-- Fonts (Courier Prime 400: upright for .resume-date, italic for .profile-tagline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;1,400&family=Special+Elite&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ '/assets/css/vintage.css' | relative_url }}">

    <!-- Favicons (relative_url, like the stylesheet: the workflow passes --baseurl) -->
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16x16.png' | relative_url }}">
    <link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}">
  </head>
  <body>
    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>
  </body>
</html>
